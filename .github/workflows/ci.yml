name: CI

# Quality + tests on every PR and push to main. On non-PR runs (push to main,
# or manual workflow_dispatch) the production pipeline also runs: the panel
# image is built for linux/amd64 (64-bit x86 Linux, the only published target)
# and pushed to GHCR as :latest plus an immutable :v<version>, with a signed
# provenance attestation and an SBOM, then an idempotent GitHub Release per
# version. The publish jobs `need` checks + tests, so untested code never ships,
# and they reuse those results instead of testing twice.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Serialize per-branch; only cancel stale PR runs - never an in-flight main
  # publish (a superseded push should not kill a build mid-upload).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege by default: the PR-facing jobs run untrusted code, so the
# workflow token they see is read-only. Only the publish jobs below escalate.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      # Skip the postinstall CSS build - `pnpm run build` below is the gate and
      # rebuilds it anyway, so letting postinstall run just does Tailwind twice.
      - run: pnpm install --frozen-lockfile
        env:
          MSM_SKIP_POSTINSTALL: '1'
      # Fails on a high or critical advisory in a production dependency.
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run build

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      # The unit suite is headless (no rendered CSS needed), so skip the
      # postinstall Tailwind build here too.
      - run: pnpm install --frozen-lockfile
        env:
          MSM_SKIP_POSTINSTALL: '1'
      - run: pnpm test

  # PRs never reach the publish `docker` job below, so without this the image
  # build (and the Dockerfile itself) is only exercised AFTER merge, on the push
  # to main that also publishes. Build one arch, no push, to catch a broken
  # Dockerfile on the PR. Reads the amd64 publish cache but never writes it, so a
  # PR build can't evict main's cache entries.
  docker-build:
    needs: [checks, tests]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: oxyx:ci
          provenance: false
          cache-from: type=gha,scope=linux-amd64

      # Vulnerability scan of the image a merge would publish: OS packages and
      # the bundled node_modules. Only issues with a released fix fail the
      # build, so an unpatched upstream CVE cannot block every PR.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: oxyx:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  # Required status check for branch protection on main: one job named
  # `quality` that is green only when every PR gate is. Keeps the protection
  # rule stable while the gates themselves can be split or renamed freely.
  quality:
    needs: [checks, tests, docker-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate passed
        run: |
          echo "checks=${{ needs.checks.result }} tests=${{ needs.tests.result }} docker-build=${{ needs.docker-build.result }}"
          test "${{ needs.checks.result }}" = success
          test "${{ needs.tests.result }}" = success
          # docker-build only runs on pull requests; a skipped run is fine on push.
          case "${{ needs.docker-build.result }}" in success|skipped) ;; *) exit 1 ;; esac

  docker:
    needs: [checks, tests]
    # Publish only from main. `push` is already main-only, but workflow_dispatch
    # can be launched from any branch: never let that overwrite :latest.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      # Signing and storing the build provenance attestation.
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GHCR/OCI names must be lowercase; github.repository keeps the owner's casing.
      - name: Prepare env
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:v${{ env.VERSION }}
          # One platform, so buildx's own provenance and SBOM attach cleanly
          # (the old two-arch merge had to turn them off).
          provenance: mode=max
          sbom: true
          # mode=max also exports the Dockerfile's RUN cache mounts (pnpm
          # store), so unchanged dependencies are never re-downloaded.
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64

      # Signed with this workflow's identity and pushed next to the image.
      # Verify: gh attestation verify oci://ghcr.io/<image>:<tag> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    # Publish a GitHub Release for each new package.json version. Idempotent -
    # only creates a release when one doesn't already exist for the current
    # version, so each version is released exactly once (and pushing an
    # existing version is a no-op). Notes come straight from CHANGELOG.md.
    # `needs: docker` so a version is only released once its image is actually
    # published: a release must never point at an image that failed to build.
    needs: [docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # creates the tag + release
    runs-on: ubuntu-latest
    steps:
      # Shallow clone is enough: the notes come from the working-tree
      # CHANGELOG.md and the release targets $GITHUB_SHA directly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes from CHANGELOG
        if: steps.check.outputs.exists == 'false'
        run: node scripts/changelog-notes.js "${{ steps.version.outputs.value }}" > release-notes.md

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.version.outputs.value }}"
          --title "v${{ steps.version.outputs.value }}"
          --notes-file release-notes.md
          --target "$GITHUB_SHA"
